name: lastspot_app
description: "KhelBhai (LastSpot) - Social sports & activity discovery platform to connect players, host local matches, and reserve activity spots."
publish_to: 'none'

# Application Semantic Version and Build Number
# In Android: build-name -> versionName, build-number -> versionCode
# In iOS: build-name -> CFBundleShortVersionString, build-number -> CFBundleVersion
# version: 1.0.0+1 # Production
version: 1.0.0+1 # Dev

environment:
  sdk: ^3.11.0

# ==============================================================================
# DEPENDENCIES
# ==============================================================================
dependencies:
  # ----------------------------------------------------------------------------
  # 1. Flutter SDK & Platform Core
  # ----------------------------------------------------------------------------
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # ----------------------------------------------------------------------------
  # 2. Backend, Database & Realtime (Supabase)
  # ----------------------------------------------------------------------------
  supabase_flutter: ^2.18.0

  # ----------------------------------------------------------------------------
  # 3. Firebase & Cloud Push Notifications
  # ----------------------------------------------------------------------------
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.1

  # ----------------------------------------------------------------------------
  # 4. State Management & Architecture
  # ----------------------------------------------------------------------------
  flutter_bloc: ^9.1.1
  equatable: ^2.1.0

  # ----------------------------------------------------------------------------
  # 5. Dependency Injection & Routing
  # ----------------------------------------------------------------------------
  get_it: ^9.2.1
  go_router: ^17.5.0

  # ----------------------------------------------------------------------------
  # 6. Data Modeling & Immutability Annotations
  # ----------------------------------------------------------------------------
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # ----------------------------------------------------------------------------
  # 7. Device, Hardware & Local Storage
  # ----------------------------------------------------------------------------
  package_info_plus: ^10.2.1
  device_info_plus: ^13.2.0
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6

  # ----------------------------------------------------------------------------
  # 8. Networking, URLs & Version Evaluation
  # ----------------------------------------------------------------------------
  url_launcher: ^6.3.2
  pub_semver: ^2.2.1

  # ----------------------------------------------------------------------------
  # 9. Media & Image Processing
  # ----------------------------------------------------------------------------
  image_picker: ^1.2.3
  image_cropper: ^12.2.1
  flutter_image_compress: ^2.5.1
  cached_network_image: ^3.4.1
  audioplayers: ^6.6.0

  # ----------------------------------------------------------------------------
  # 10. UI Styling, Typography, Loaders & Animations
  # ----------------------------------------------------------------------------
  google_fonts: ^8.2.1
  intl: ^0.20.2
  shimmer: ^3.0.0
  skeletonizer: ^2.1.3
  lottie: ^3.6.1
  flutter_staggered_animations: ^1.1.1

  # ----------------------------------------------------------------------------
  # 11. Logging & Diagnostics
  # ----------------------------------------------------------------------------
  logger: ^2.8.0

# ==============================================================================
# DEV DEPENDENCIES (Testing, Linting & Code Generation)
# ==============================================================================
dev_dependencies:
  # ----------------------------------------------------------------------------
  # 1. Testing Framework
  # ----------------------------------------------------------------------------
  flutter_test:
    sdk: flutter

  # ----------------------------------------------------------------------------
  # 2. Linting & Code Hygiene
  # ----------------------------------------------------------------------------
  flutter_lints: ^6.0.0

  # ----------------------------------------------------------------------------
  # 3. Code Generation (Freezed, JSON Serialization, Asset Accessors)
  # ----------------------------------------------------------------------------
  build_runner: ^2.16.1
  freezed: ^4.0.2
  json_serializable: ^6.14.1
  flutter_gen_runner: ^5.15.0

# ==============================================================================
# FLUTTER CONFIGURATION & ASSET DECLARATIONS
# ==============================================================================
flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/ain/
    - assets/audio/
    - assets/images/categories/
    - assets/images/empty_states/
    - assets/images/onboarding/
    - assets/icons/
    - assets/branding/
    - assets/navigation/

# Flutter Gen Settings
flutter_gen:
  integrations:
    lottie: true
